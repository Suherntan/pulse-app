<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A-N-T Analysis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0B2545; --gold:#F3AF3D; --gold-dark:#A86F14; --text:#1B2433; --text-light:#5F6673; --line:#E3DED3;
  --red:#C9402B; --ok:#2E8B3E;
  --head:'Oswald','Arial Narrow',sans-serif; --body:'Work Sans',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--body);background:#E9E6DF;color:var(--text);-webkit-print-color-adjust:exact;print-color-adjust:exact}
.tools{position:sticky;top:0;z-index:5;display:flex;gap:10px;justify-content:center;padding:12px 16px;background:#E9E6DF}
.tools button,.tools a{border:0;border-radius:12px;padding:12px 18px;font:700 14px var(--head);letter-spacing:.1em;cursor:pointer;text-decoration:none}
.tools .primary{background:var(--gold);color:var(--navy);box-shadow:0 4px 0 var(--gold-dark)}
.tools .ghost{background:#fff;color:var(--navy)}
.tools button:disabled{opacity:.6;cursor:wait}
.status{max-width:210mm;margin:0 auto 12px;padding:0 16px;font-size:14px;text-align:center;color:var(--navy)}
.status a{color:var(--navy);font-weight:700}
body.capturing{overflow:hidden}
body.capturing .page{width:794px;min-height:1123px;height:1123px;margin:0;box-shadow:none}
body.capturing .notes:empty::before{content:''}
.page{width:210mm;min-height:297mm;margin:0 auto 24px;background:#fff;box-shadow:0 10px 40px rgba(0,0,0,.15);display:flex;flex-direction:column}
.band{background:var(--navy);color:#fff;padding:22px 28px;display:flex;align-items:center;gap:20px}
.band img{height:56px}
.band h1{font-family:var(--head);font-weight:700;font-size:28px;letter-spacing:.14em}
.band h1 span{color:var(--gold)}
.band .date{margin-left:auto;text-align:right;font-size:12px;color:#C9D2E0;line-height:1.5}
.band .date b{display:block;color:#fff;font-size:14px}
.body{padding:20px 28px;flex:1;display:flex;flex-direction:column;gap:16px}
.client{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.client div{padding:10px 14px;border-right:1px solid var(--line)}
.client div:last-child{border-right:0}
.client small{display:block;font-size:10px;font-weight:600;letter-spacing:.1em;color:var(--text-light);text-transform:uppercase}
.client b{font-size:15px}
.client .ph{display:block;font-size:12px;color:var(--text-light);margin-top:2px}
h2{font-family:var(--head);font-weight:600;font-size:16px;letter-spacing:.14em;color:var(--navy);border-bottom:3px solid var(--gold);padding-bottom:6px}
.life{display:grid;grid-template-columns:210px 1fr;gap:20px;align-items:center}
.pyr svg{width:100%;height:auto;display:block}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-family:var(--head);font-weight:600;font-size:11px;letter-spacing:.1em;color:var(--gold-dark);text-align:right;padding:6px 8px;border-bottom:1px solid var(--line)}
th:first-child{text-align:left}
td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums;font-weight:500}
td:first-child{text-align:left;font-family:var(--head);font-weight:600;letter-spacing:.04em;color:var(--navy)}
td:first-child i{display:inline-block;width:8px;height:16px;border-radius:2px;background:var(--c);vertical-align:-3px;margin-right:8px}
td.gap{font-weight:700}
td.short{color:var(--red)} td.ok{color:var(--ok)}
tfoot td{border-bottom:0;font-family:var(--head);font-size:14px;padding-top:12px}
.prio{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.prio div{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;background:#FBF6EA;font-size:13px}
.prio .n{width:26px;height:26px;border-radius:7px;background:var(--navy);color:#fff;display:grid;place-items:center;font-family:var(--head);font-weight:700;flex:none}
.prio b{font-family:var(--head);letter-spacing:.04em;color:var(--navy)}
.prio span{margin-left:auto;color:var(--red);font-weight:700}
.none{font-size:13px;color:var(--text-light)}
.bg{display:grid;grid-template-columns:110px 1fr;gap:6px 14px;font-size:12.5px;margin-top:12px}
.bg dt{font-family:var(--head);font-weight:600;font-size:11px;letter-spacing:.1em;color:var(--gold-dark);padding-top:2px}
.bg dd{color:var(--text)}
.notes{border:1px solid var(--line);border-radius:10px;min-height:70px;padding:10px 12px;font-size:13px;outline:none;white-space:pre-wrap}
.notes:empty::before{content:attr(data-ph);color:#A9A396}
.foot{padding:10px 28px;font-size:10px;color:var(--text-light);border-top:1px solid var(--line);display:flex;justify-content:space-between}
@media screen and (max-width:820px){
  body:not(.capturing) .page{width:100%;min-height:0;margin:0 0 16px}
  body:not(.capturing) .client{grid-template-columns:1fr 1fr}
  body:not(.capturing) .client div:nth-child(2){border-right:0}
  body:not(.capturing) .client div:nth-child(-n+2){border-bottom:1px solid var(--line)}
  body:not(.capturing) .life{grid-template-columns:1fr}
  body:not(.capturing) .pyr{max-width:220px;margin:0 auto}
  body:not(.capturing) .prio{grid-template-columns:1fr}
}
@page{size:A4;margin:0}
@media print{
  body{background:#fff}
  .tools{display:none}
  .page{box-shadow:none;margin:0;width:210mm;height:297mm}
  .notes:empty::before{content:''}
}
</style>
</head>
<body>
<div class="tools">
  <a class="ghost" href="ant-deck-preview.html">← BACK TO SLIDES</a>
  <button class="ghost" id="printBtn">DOWNLOAD PDF</button>
  <button class="primary" id="driveBtn" style="display:none">SAVE TO DRIVE</button>
</div>
<div class="status" id="status"></div>

<article class="page">
  <header class="band">
    <img src="ant-assets/logo-light.png" alt="ANT Wealth System">
    <h1>A-N-T <span>ANALYSIS</span></h1>
    <div class="date">Prepared on<b id="date">—</b></div>
  </header>

  <div class="body">
    <div class="client">
      <div><small>Client</small><b id="cName">—</b></div>
      <div><small>Client ID</small><b id="cId">—</b></div>
      <div><small>Age</small><b id="cAge">—</b></div>
      <div><small>Agent</small><b id="cAgent">—</b><span class="ph" id="cAgentPh"></span></div>
    </div>

    <section id="bgSec">
      <h2>BACKGROUND</h2>
      <dl class="bg" id="bg"></dl>
    </section>

    <section>
      <h2>L.I.F.E</h2>
      <div class="life" style="margin-top:14px">
        <div class="pyr" id="pyr"></div>
        <table>
          <thead><tr><th>AREA</th><th>CURRENT STATUS</th><th>L.I.F.E</th><th>FINANCIAL GOALS</th></tr></thead>
          <tbody id="rows"></tbody>
          <tfoot><tr><td>TOTAL</td><td id="tCur"></td><td id="tGap" class="gap"></td><td id="tGoal"></td></tr></tfoot>
        </table>
      </div>
    </section>

    <section>
      <h2>PRIORITY</h2>
      <div class="prio" id="prio" style="margin-top:14px"></div>
    </section>

    <section>
      <h2>NOTES</h2>
      <div class="notes" id="notes" contenteditable="true" data-ph="Tap to add notes before saving…" style="margin-top:14px"></div>
    </section>

  </div>
  <div class="foot"><span id="prep">ANT Wealth System · Analyze. Navigate. Transform.</span><span id="ref"></span></div>
</article>

<script src="ant-api.js"></script>
<script>
// Top → bottom of the pyramid; priority runs the other way (most urgent first).
const AREAS = [
  {k:'investment',      name:'INVESTMENT',       c:'#1B998B'},
  {k:'education',       name:'EDUCATION',        c:'#2E86AB'},
  {k:'death',           name:'DEATH',            c:'#C9962B'},
  {k:'criticalIllness', name:'CRITICAL ILLNESS', c:'#E67E22'},
  {k:'disability',      name:'DISABILITY',       c:'#D35400'},
  {k:'hospitalization', name:'HOSPITALIZATION',  c:'#C0392B'}
];
const $ = id => document.getElementById(id);
const fmt = n => n === null || n === undefined ? '–' : Math.round(n).toLocaleString('en-US');
const read = k => { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (_) { return null; } };

// Sample numbers if the slides haven't been used yet, so the layout can still be checked.
const SAMPLE = {life:{
  hospitalization:{current:750000,goal:1000000}, disability:{current:100000,goal:1000000},
  criticalIllness:{current:100000,goal:1000000}, death:{current:5000,goal:100000},
  education:{current:null,goal:null}, investment:{current:500000,goal:4500000}}};
const analysis = read('ant-analysis-current') || SAMPLE;
const client = read('ant-factfind-current') || {name:'Sample Client', clientId:'C-0000', age:'—', agentName:'Agent Name', agentPhone:'012-000 0000'};

const now = new Date(analysis.savedAt || Date.now());
$('date').textContent = now.toLocaleDateString('en-GB', {day:'numeric', month:'long', year:'numeric'});
$('cName').textContent = client.name || '—';
$('cId').textContent = client.clientId || '—';
$('cAge').textContent = client.age ?? '—';
$('cAgent').textContent = client.agentName || client.agentId || '—';
$('cAgentPh').textContent = client.agentPhone || '';
if (client.agentName) $('prep').textContent = 'Prepared by ' + client.agentName + (client.agentPhone ? ' · ' + client.agentPhone : '') + ' · ANT Wealth System';
$('ref').textContent = (client.clientId || '') + ' · ' + now.toISOString().slice(0, 10);
document.title = `A-N-T Analysis – ${client.name || 'Client'} – ${now.toISOString().slice(0, 10)}`;

// Background from the Fact-Find form
const b = client.background;
if (b) {
  const esc = t => String(t).replace(/[&<>"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));
  const goals = [];
  if (b.goals?.includes('retire')) goals.push('Retire' + (b.retireAge ? ' at ' + b.retireAge : '') + (b.retireCash ? ' · ' + fmt(b.retireCash) + ' / month' : ''));
  if (b.goals?.includes('education')) goals.push("Kids' education");
  const fam = [];
  if (b.people?.includes('spouse')) fam.push('Spouse / partner' + (b.spouseJob ? ' (' + b.spouseJob + ')' : ''));
  const ages = (b.childrenAges || []).filter(a => a != null);
  if ((b.childrenAges || []).length) fam.push(b.childrenAges.length + (b.childrenAges.length === 1 ? ' child' : ' children') + (ages.length ? ' – age ' + ages.join(', ') : ''));
  if (b.people?.includes('parents')) fam.push('Parents' + (b.parentsDepend ? ' – depending: ' + b.parentsDepend : ''));
  if (b.otherPeople) fam.push(b.otherPeople);
  const rows = [['MOTIVATION', b.motivation], ['GOALS', goals.join(' · ')], ['OTHER GOALS', b.otherGoals], ['FAMILY', fam.join(' · ')]]
    .filter(([, v]) => v);
  $('bg').innerHTML = rows.map(([k, v]) => `<dt>${k}</dt><dd>${esc(v)}</dd>`).join('');
  if (!rows.length) $('bgSec').remove();
} else { $('bgSec').remove(); }

// Table + totals
let tCur = 0, tGoal = 0, tGap = 0, anyGap = false;
$('rows').innerHTML = AREAS.map(a => {
  const v = analysis.life[a.k] || {}, cur = v.current ?? null, goal = v.goal ?? null;
  const gap = cur !== null && goal !== null ? goal - cur : null;
  if (cur !== null) tCur += cur;
  if (goal !== null) tGoal += goal;
  if (gap !== null) { anyGap = true; tGap += Math.max(gap, 0); }
  const cls = gap === null ? '' : gap > 0 ? 'short' : 'ok';
  return `<tr style="--c:${a.c}"><td><i></i>${a.name}</td><td>${fmt(cur)}</td>
    <td class="gap ${cls}">${gap === null ? '–' : gap > 0 ? fmt(gap) : '✓'}</td><td>${fmt(goal)}</td></tr>`;
}).join('');
$('tCur').textContent = fmt(tCur); $('tGoal').textContent = fmt(tGoal);
$('tGap').textContent = anyGap ? (tGap > 0 ? fmt(tGap) : '✓') : '–';
$('tGap').classList.add(tGap > 0 ? 'short' : 'ok');

// Mini pyramid, coloured tiers; tiers still short get a red dot
const H = 240, W = 210, N = AREAS.length, gapPx = 4, th = (H - gapPx * (N - 1)) / N;
const tiers = AREAS.map((a, i) => {
  const y1 = i * (th + gapPx), y2 = y1 + th;
  const w1 = W * y1 / H, w2 = W * y2 / H, cx = W / 2;
  const v = analysis.life[a.k] || {}, short = v.current != null && v.goal != null && v.goal - v.current > 0;
  return `<polygon points="${cx - w1 / 2},${y1} ${cx + w1 / 2},${y1} ${cx + w2 / 2},${y2} ${cx - w2 / 2},${y2}" fill="${a.c}"/>` +
    (short ? `<circle cx="${cx + w2 / 2 - 2}" cy="${(y1 + y2) / 2}" r="5" fill="#fff" stroke="#C9402B" stroke-width="3"/>` : '');
}).join('');
$('pyr').innerHTML = `<svg viewBox="-6 0 ${W + 12} ${H}" role="img" aria-label="L.I.F.E pyramid">${tiers}</svg>`;

// Priority: gaps, most urgent (bottom of pyramid) first
const prio = AREAS.slice().reverse().map(a => ({a, v: analysis.life[a.k] || {}}))
  .filter(x => x.v.current != null && x.v.goal != null && x.v.goal - x.v.current > 0);
$('prio').innerHTML = prio.length
  ? prio.map((x, i) => `<div><span class="n">${i + 1}</span><b>${x.a.name}</b><span>${fmt(x.v.goal - x.v.current)}</span></div>`).join('')
  : '<p class="none">No gaps – all areas covered.</p>';

// ---- Save: download on this device, or into the client's Drive folder ----
document.getElementById('printBtn').onclick = () => window.print();

function loadScript(src) {
  return new Promise((ok, fail) => { const t = document.createElement('script'); t.src = src; t.onload = ok; t.onerror = () => fail(new Error('Could not load ' + src)); document.head.appendChild(t); });
}
// Render the A4 page to a PDF (base64) in the browser – keeps the exact look.
async function makePdfBase64() {
  if (!window.html2canvas) await loadScript('vendor/html2canvas.min.js');
  if (!window.jspdf) await loadScript('vendor/jspdf.umd.min.js');
  document.body.classList.add('capturing');
  try {
    await document.fonts?.ready;
    const canvas = await html2canvas(document.querySelector('.page'), {scale: 2, backgroundColor: '#ffffff', useCORS: true, windowWidth: 794});
    const pdf = new jspdf.jsPDF({unit: 'mm', format: 'a4'});
    pdf.addImage(canvas.toDataURL('image/jpeg', 0.92), 'JPEG', 0, 0, 210, 297);
    return pdf.output('datauristring').split(',')[1];
  } finally {
    document.body.classList.remove('capturing');
  }
}

const driveBtn = $('driveBtn'), status = $('status');
const canSave = AntApi.connected() && client.clientId && !/DEMO|0000/.test(client.clientId);
if (canSave) driveBtn.style.display = '';
else if (AntApi.connected()) status.textContent = 'Save the client in the Fact-Find form first to keep this in Google Drive.';

driveBtn.onclick = async () => {
  driveBtn.disabled = true; driveBtn.textContent = 'SAVING…'; status.textContent = 'Making the PDF…';
  try {
    const pdfBase64 = await makePdfBase64();
    status.textContent = 'Uploading to Google Drive…';
    const r = await AntApi.post('antSaveAnalysis', {
      clientId: client.clientId,
      life: analysis.life,
      notes: $('notes').innerText.trim(),
      pdfBase64,
      fileName: document.title
    });
    status.innerHTML = (r.replaced ? '✓ Updated today\'s analysis (' : '✓ Saved (') + r.analysisId + '). <a target="_blank" rel="noopener">Open PDF in Drive ↗</a>';
    status.querySelector('a').href = r.pdfUrl;
    driveBtn.textContent = 'SAVED ✓';
  } catch (err) {
    status.textContent = 'Not saved: ' + err.message;
    driveBtn.disabled = false; driveBtn.textContent = 'SAVE TO DRIVE';
  }
};
</script>
</body>
</html>
