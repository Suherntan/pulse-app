<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A-N-T Deck Preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Work+Sans:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0B2545; --navy-deep:#010C21; --navy-mid:#1A4478; --navy-line:#2A5288;
  --gold-soft:#F3AF3D; --cream:#F9DAAE;
  --white:#F7F5F0; --red:#E5533D; --ok:#5DBB63;
  --head:'Oswald','Arial Narrow',sans-serif; --body:'Work Sans',system-ui,sans-serif;
  --ease:cubic-bezier(.23,1,.32,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;color:var(--white);font-family:var(--body);overflow:hidden}
.viewport{position:fixed;inset:0 0 48px 0}
.stage{width:1920px;height:1080px;position:absolute;left:50%;top:50%;overflow:hidden;
  background:var(--navy)}
.slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .45s ease,visibility .45s}
.slide.active{opacity:1;visibility:visible}
.abs{position:absolute}
.logo{left:42px;top:30px;width:240px;height:120px;z-index:4}
.logo img{width:100%;height:100%;object-fit:contain}
.step{opacity:0;transform:translateY(28px);transition:opacity .5s var(--ease),transform .5s var(--ease)}
.step.on{opacity:1;transform:none}
.bar{display:grid;place-items:center;font-family:var(--head);font-weight:700;letter-spacing:.08em;border-radius:10px;line-height:1;text-align:center}

/* ---------- Slide 2 (original layout, new colours) ---------- */
.need{width:240px;height:323px;display:flex;flex-direction:column;align-items:center}
.need .dot{width:240px;height:240px;border-radius:50%;background:var(--gold-soft);display:grid;place-items:center}
.need .dot svg{width:130px;height:130px}
.need .line{width:6px;flex:1;background:var(--gold-soft)}
.lifestyle{left:146px;top:503px;width:1628px;height:104px;font-size:84px;color:var(--navy-deep);
  background:var(--gold-soft)}
.plan{width:448px;height:123px;font-size:76px;color:var(--white);background:var(--navy-mid)}
.fill{color:var(--navy-deep);background:var(--white);font-size:64px}
.income{left:741px;top:782px;width:473px;height:104px;font-size:80px;color:var(--navy-deep);background:var(--gold-soft)}
.uparrow{left:933px;top:633px;width:103px;height:133px}
.xmark{left:210px;top:607px;width:356px;height:335px;display:grid;place-items:center;font-family:var(--head);font-weight:700;
  font-size:340px;line-height:1;color:var(--red);opacity:0;transform:scale(1.8) rotate(-8deg);
  transition:opacity .35s ease,transform .45s cubic-bezier(.34,1.56,.64,1)}
.xmark.on{opacity:1;transform:none}

/* ---------- Slide 3 ---------- */
.title3{left:289px;top:40px;width:575px;font-family:var(--head);font-weight:700;font-size:130px;letter-spacing:.12em;text-align:center;color:var(--gold-soft);
  z-index:3}
.tri{left:100px;top:80px;width:854px;height:854px}
.tier{height:66px;z-index:2}
.tier .band{position:absolute;inset:0;border-radius:6px;background:var(--c);transform:scaleX(0);transform-origin:left center;
  }
.tier .mark{position:absolute;left:0;top:-14px;height:94px;overflow:visible;pointer-events:none}
.tier .mark path{fill:none;stroke:var(--white);stroke-width:7;stroke-linecap:round;opacity:.9}
.tier .word{position:absolute;left:24px;top:0;height:66px;display:flex;align-items:center;white-space:nowrap;
  font-family:var(--head);font-weight:700;font-size:52px;letter-spacing:.06em;color:#fff;text-shadow:0 3px 10px rgba(0,0,0,.55);
  clip-path:inset(0 100% 0 0);transform:translateX(-30px)}
.tier.on .band{animation:band .45s var(--ease) forwards}
.tier.on .mark path{animation:draw .7s var(--ease) .35s forwards}
.tier.on .word{animation:drag .75s var(--ease) .4s forwards}
@keyframes band{to{transform:scaleX(1)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes drag{to{clip-path:inset(0 -80% 0 0);transform:none}}
.tier.done .band{animation:none;transform:scaleX(1)}
.tier.done .mark path{animation:none;stroke-dashoffset:0}
.tier.done .word{animation:none;clip-path:inset(0 -80% 0 0);transform:none}

.th{top:150px;font-family:var(--head);font-weight:600;font-size:32px;line-height:1.1;letter-spacing:.1em;color:var(--gold-soft);text-align:center;width:240px}
.cell{width:240px;height:66px;display:flex;align-items:center;justify-content:center}
.row{opacity:0;transform:translateX(30px);transition:opacity .5s var(--ease) .5s,transform .5s var(--ease) .5s}
.row.on{opacity:1;transform:none}
input.money{width:100%;height:58px;background:#06182F;border:2px solid var(--navy-line);color:var(--white);border-radius:10px;
  padding:0 16px;font:600 30px var(--body);text-align:right;outline:none;transition:border-color .2s}
input.money:focus{border-color:var(--gold-soft)}
.gap{font:700 34px var(--body);transition:color .3s}
.gap.short{color:var(--red)} .gap.ok{color:var(--ok)}
.gap.pop{animation:pop .45s var(--ease)}
@keyframes pop{0%{transform:scale(1.3)}100%{transform:none}}

/* ---------- controls ---------- */
.nav{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:5}
.nav button{font:600 13px var(--body);color:var(--white);background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:8px 16px;cursor:pointer}
.nav button:hover{background:rgba(255,255,255,.18)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="viewport"><div class="stage" id="stage">

  <!-- SLIDE 2 – same layout & wording as the original, A-N-T colours -->
  <section class="slide" data-slide="2">
    <div class="abs logo"><img src="ant-assets/logo-light.png" alt="ANT Wealth System"></div>
    <div class="abs need step" data-step="1" style="left:241px;top:180px"><div class="dot"><svg viewBox="0 0 64 64" fill="none" stroke="#0B2545" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" aria-label="food"><circle cx="32" cy="36" r="14"/><path d="M10 10v12a4 4 0 0 0 8 0V10M14 10v44M54 10c-6 4-6 16 0 18v26"/></svg></div><div class="line"></div></div>
    <div class="abs need step" data-step="2" style="left:677px;top:180px"><div class="dot"><svg viewBox="0 0 64 64" fill="none" stroke="#0B2545" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" aria-label="clothes"><path d="M22 10 10 18l6 10 6-3v29h20V25l6 3 6-10-12-8c-2 5-6 7-10 7s-8-2-10-7z"/></svg></div><div class="line"></div></div>
    <div class="abs need step" data-step="3" style="left:1093px;top:180px"><div class="dot"><svg viewBox="0 0 64 64" fill="none" stroke="#0B2545" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" aria-label="house"><path d="M6 30 32 9l26 21M13 25v29h38V25M26 54V39h12v15"/></svg></div><div class="line"></div></div>
    <div class="abs need step" data-step="4" style="left:1479px;top:180px"><div class="dot"><svg viewBox="0 0 64 64" fill="none" stroke="#0B2545" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" aria-label="education"><path d="M4 24 32 12l28 12-28 12z"/><path d="M16 30v12c0 6 32 6 32 0V30M58 25v15"/></svg></div><div class="line"></div></div>

    <div class="abs bar lifestyle">LIFESTYLE</div>

    <div class="abs bar plan step" data-step="6" style="left:146px;top:651px">PLAN A</div>
    <div class="abs bar fill step" data-step="5" style="left:146px;top:789px;width:448px;height:98px">EARNING</div>
    <div class="abs xmark" data-step="7">X</div>

    <svg class="abs uparrow" viewBox="0 0 103 133" aria-hidden="true"><path d="M51.5 4 99 58H72v71H31V58H4z" fill="#F3AF3D"/></svg>
    <div class="abs bar income">INCOME</div>

    <div class="abs bar plan step" data-step="8" style="left:1375px;top:651px">PLAN B</div>
    <div class="abs bar fill step" data-step="9" style="left:1375px;top:791px;width:448px;height:155px;font-size:58px;line-height:1.05">FINANCIAL<br>PLANNING</div>
  </section>

  <!-- SLIDE 3 – L.I.F.E -->
  <section class="slide" data-slide="3">
    <div class="abs logo"><img src="ant-assets/logo-light.png" alt="ANT Wealth System"></div>
    <svg class="abs tri" viewBox="0 0 854 854" aria-hidden="true">
      <defs><linearGradient id="tg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0F2C55"/><stop offset="1" stop-color="#010C21"/></linearGradient></defs>
      <polygon points="427,0 854,854 0,854" fill="#06182F" stroke="#F3AF3D" stroke-width="4" stroke-linejoin="round"/>
    </svg>
    <div class="abs title3">L.I.F.E</div>
    <div id="tiers"></div>

    <div class="abs th" style="left:1080px">CURRENT<br>STATUS</div>
    <div class="abs th" style="left:1340px">L.I.F.E</div>
    <div class="abs th" style="left:1600px">FINANCIAL<br>GOALS</div>
    <div id="rows"></div>
  </section>
</div></div>

<div class="nav">
  <button id="prev">← Back</button>
  <button id="all">Show all</button>
  <button id="next">Next →</button>
</div>

<script>
// Bottom → top = reveal order (most urgent first). Banner width follows the triangle;
// a word that is too long simply runs out past the right-hand side.
const TRI = {apexX: 527, top: 80, h: 854};
const TIERS = [
  {name:'HOSPITALIZATION',  y:860, c:'#C0392B'},
  {name:'DISABILITY',       y:742, c:'#D35400'},
  {name:'CRITICAL ILLNESS', y:624, c:'#E67E22'},
  {name:'DEATH',            y:506, c:'#C9962B'},
  {name:'EDUCATION',        y:388, c:'#2E86AB'},
  {name:'INVESTMENT',       y:270, c:'#1B998B'}
];
const tiersEl = document.getElementById('tiers'), rowsEl = document.getElementById('rows');

TIERS.forEach(t => {
  const w = Math.round((t.y + 33 - TRI.top) * 854 / TRI.h) + 40;   // triangle width at the banner's middle
  const x = TRI.apexX - w / 2;
  const len = w + 200;                                            // brush runs past the banner's right edge
  const d = document.createElement('div');
  d.className = 'abs tier';
  d.style.cssText = `left:${x}px;top:${t.y}px;width:${w}px;--c:${t.c}`;
  d.innerHTML = `<div class="band"></div>
    <svg class="mark" width="${len}" height="94" viewBox="0 0 ${len} 94" aria-hidden="true">
      <path d="M10 84 C ${len*.25} 70, ${len*.55} 92, ${len-14} 72" stroke-dasharray="${len*1.1}" stroke-dashoffset="${len*1.1}"/></svg>
    <div class="word">${t.name}</div>`;
  tiersEl.appendChild(d);

  const r = document.createElement('div');
  r.className = 'row';
  r.innerHTML = `<div class="abs cell" style="left:1080px;top:${t.y}px"><input class="money" inputmode="numeric" aria-label="${t.name} current status"></div>
    <div class="abs cell" style="left:1340px;top:${t.y}px"><span class="gap"></span></div>
    <div class="abs cell" style="left:1600px;top:${t.y}px"><input class="money" inputmode="numeric" aria-label="${t.name} financial goal"></div>`;
  rowsEl.appendChild(r);
});

const num = v => { const n = Number(String(v).replace(/[^0-9.-]/g, '')); return isFinite(n) ? n : 0; };
const fmt = n => Math.round(n).toLocaleString('en-US');

// L.I.F.E (gap) = Financial Goals − Current Status, shown once both are filled
function recalc() {
  [...rowsEl.children].forEach(r => {
    const [cur, goal] = r.querySelectorAll('input');
    const g = r.querySelector('.gap'), before = g.textContent;
    if (!cur.value.trim() || !goal.value.trim()) { g.className = 'gap'; g.textContent = ''; return; }
    const gap = num(goal.value) - num(cur.value);
    g.className = 'gap ' + (gap > 0 ? 'short' : 'ok');
    g.textContent = gap > 0 ? fmt(gap) : '✓';
    if (g.textContent !== before) { void g.offsetWidth; g.classList.add('pop'); }
  });
}
rowsEl.addEventListener('input', recalc);
rowsEl.addEventListener('focusout', e => {
  if (e.target.matches('input.money') && e.target.value.trim()) e.target.value = fmt(num(e.target.value));
});

// ---- Click-by-click steps, same order as the original deck ----
const slides = [...document.querySelectorAll('.slide')];
let cur = 0, step = 0;

function groups(s) {
  if (s.dataset.slide === '3') {
    const r = [...rowsEl.children];
    return [...tiersEl.children].map((el, i) => [el, r[i]]);
  }
  const els = [...s.querySelectorAll('[data-step]')];
  const max = Math.max(...els.map(e => +e.dataset.step));
  return Array.from({length: max}, (_, i) => els.filter(e => +e.dataset.step === i + 1));
}
const maxSteps = () => groups(slides[cur]).length;
function showStep(n, instant) {
  step = n;
  groups(slides[cur]).forEach((g, i) => g.forEach(el => {
    el.classList.toggle('on', i < n);
    el.classList.toggle('done', !!instant && i < n);
  }));
}
function go(i, toEnd) {
  cur = Math.max(0, Math.min(slides.length - 1, i));
  slides.forEach((s, k) => s.classList.toggle('active', k === cur));
  showStep(toEnd ? maxSteps() : 0, toEnd);
}
function next() { if (step < maxSteps()) showStep(step + 1); else if (cur < slides.length - 1) go(cur + 1); }
function prev() { if (step > 0) showStep(step - 1, true); else if (cur > 0) go(cur - 1, true); }

document.getElementById('next').onclick = next;
document.getElementById('prev').onclick = prev;
document.getElementById('all').onclick = () => showStep(maxSteps(), true);
document.addEventListener('keydown', e => {
  if (e.target.matches('input')) return;
  if (['ArrowRight', ' ', 'PageDown', 'Enter'].includes(e.key)) { e.preventDefault(); next(); }
  if (['ArrowLeft', 'PageUp'].includes(e.key)) { e.preventDefault(); prev(); }
});
let sx = null;
document.addEventListener('touchstart', e => { if (!e.target.closest('input,button')) sx = e.touches[0].clientX; }, {passive:true});
document.addEventListener('touchend', e => {
  if (sx === null) return;
  const dx = e.changedTouches[0].clientX - sx; sx = null;
  if (Math.abs(dx) > 40) dx < 0 ? next() : prev();
});

function fit() {
  const s = Math.min(innerWidth / 1920, (innerHeight - 48) / 1080);
  document.getElementById('stage').style.transform = `translate(-50%,-50%) scale(${s})`;
}
addEventListener('resize', fit); fit();
go(0);
</script>
</body>
</html>
