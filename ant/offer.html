<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A-N-T Offer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0B2545; --gold:#F3AF3D; --gold-dark:#A86F14; --text:#1B2433; --text-light:#5F6673; --line:#E3DED3;
  --red:#C9402B; --ok:#2E8B3E; --cream:#FBF6EA;
  --head:'Oswald','Arial Narrow',sans-serif; --body:'Work Sans',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--body);background:#E9E6DF;color:var(--text);-webkit-print-color-adjust:exact;print-color-adjust:exact}
.tools{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:10px;justify-content:center;padding:12px 16px;background:#E9E6DF}
.tools button,.tools a{border:0;border-radius:12px;padding:12px 18px;font:700 14px var(--head);letter-spacing:.1em;cursor:pointer;text-decoration:none}
.tools .primary{background:var(--gold);color:var(--navy);box-shadow:0 4px 0 var(--gold-dark)}
.tools .ghost{background:#fff;color:var(--navy)}
.status{max-width:210mm;margin:0 auto 12px;padding:0 16px;font-size:14px;text-align:center;color:var(--navy)}

/* ---- Editor (screen only) ---- */
.edit{max-width:210mm;margin:0 auto 20px;padding:18px;background:#fff;border-radius:14px;box-shadow:0 6px 24px rgba(0,0,0,.08)}
.edit h3{font-family:var(--head);font-weight:600;font-size:15px;letter-spacing:.14em;color:var(--navy);margin-bottom:10px}
.edit .scroll{overflow-x:auto}
.edit table{border-collapse:collapse;font-size:13px;min-width:100%}
.edit th,.edit td{padding:4px;border-bottom:1px solid var(--line);vertical-align:middle}
.edit th{font-family:var(--head);font-weight:600;font-size:11px;letter-spacing:.08em;color:var(--gold-dark);text-align:left}
.edit input,.edit select{width:100%;min-width:90px;padding:9px 8px;border:1px solid var(--line);border-radius:8px;font:500 14px var(--body);color:var(--text);background:#fff}
.edit input.num{text-align:right;font-variant-numeric:tabular-nums}
.edit .plan{display:grid;gap:4px;min-width:130px}
.edit .x{border:0;background:none;color:var(--red);font-size:20px;line-height:1;width:44px;height:40px;cursor:pointer}
.edit .row-btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.edit .row-btns button{border:1px dashed var(--gold-dark);background:var(--cream);color:var(--navy);border-radius:10px;padding:10px 14px;font:600 13px var(--head);letter-spacing:.08em;cursor:pointer}
.edit .opts{display:flex;flex-wrap:wrap;gap:14px;align-items:center;margin-top:14px;font-size:14px}
.edit .opts label{display:flex;gap:6px;align-items:center}
.edit .opts select{width:auto;min-width:0}
.edit tfoot td{border-bottom:0;padding-top:10px}
.edit .upload{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin-bottom:14px;padding:12px;border-radius:12px;background:var(--cream)}
.edit .up{display:inline-flex;align-items:center;min-height:44px;padding:0 16px;border-radius:10px;background:var(--navy);color:#fff;font:600 13px var(--head);letter-spacing:.1em;cursor:pointer}
.edit .up input{position:absolute;width:1px;height:1px;opacity:0}
.edit .up:focus-within{outline:3px solid var(--gold)}
#upMsg{font-size:13px;color:var(--text-light);flex:1;min-width:200px}
#upMsg.err{color:var(--red)} #upMsg.ok{color:var(--ok)}
.edit .lbl{font-family:var(--head);font-weight:600;letter-spacing:.06em;color:var(--navy)}

/* ---- A4 page ---- */
body.capturing{overflow:hidden}
body.capturing .page{width:794px;min-height:1123px;height:1123px;margin:0;box-shadow:none}
body.capturing .notes:empty::before{content:''}
.page{width:210mm;min-height:297mm;margin:0 auto 24px;background:#fff;box-shadow:0 10px 40px rgba(0,0,0,.15);display:flex;flex-direction:column}
.band{background:var(--navy);color:#fff;padding:22px 28px;display:flex;align-items:center;gap:20px}
.band img{height:56px}
.band h1{font-family:var(--head);font-weight:700;font-size:28px;letter-spacing:.14em}
.band h1 span{color:var(--gold)}
.band .date{margin-left:auto;text-align:right;font-size:12px;color:#C9D2E0;line-height:1.5}
.band .date b{display:block;color:#fff;font-size:14px}
.body{padding:20px 28px;flex:1;display:flex;flex-direction:column;gap:18px}
.client{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.client div{padding:10px 14px;border-right:1px solid var(--line)}
.client div:last-child{border-right:0}
.client small{display:block;font-size:10px;font-weight:600;letter-spacing:.1em;color:var(--text-light);text-transform:uppercase}
.client b{font-size:15px}
.client .ph{display:block;font-size:12px;color:var(--text-light);margin-top:2px}
h2{font-family:var(--head);font-weight:600;font-size:16px;letter-spacing:.14em;color:var(--navy);border-bottom:3px solid var(--gold);padding-bottom:6px}
.doc{width:100%;border-collapse:collapse;font-size:13px;margin-top:12px;table-layout:fixed}
.doc th{padding:8px;text-align:right;vertical-align:bottom;border-bottom:2px solid var(--navy)}
.doc th:first-child{text-align:left;width:26%;font-family:var(--head);font-weight:600;font-size:11px;letter-spacing:.1em;color:var(--gold-dark)}
.doc th .tag{display:inline-block;padding:2px 7px;border-radius:5px;font:600 10px var(--head);letter-spacing:.1em}
.doc th .tag.ex{background:#EEF1F5;color:var(--text-light)}
.doc th .tag.pr{background:var(--gold);color:var(--navy)}
.doc th b{display:block;margin-top:4px;font-family:var(--head);font-weight:600;font-size:13px;letter-spacing:.03em;color:var(--navy);overflow-wrap:anywhere}
.doc th.pr,.doc td.pr{background:var(--cream)}
.doc td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums;font-weight:500}
.doc td:first-child{text-align:left;font-family:var(--head);font-weight:600;letter-spacing:.04em;color:var(--navy)}
.doc td:first-child i{display:inline-block;width:8px;height:16px;border-radius:2px;background:var(--c,#D8D2C4);vertical-align:-3px;margin-right:8px}
.doc td.nil{color:#B9B3A6}
.doc td.tot,.doc th.tot{font-weight:700;border-left:1px solid var(--line)}
.doc tr.prem td{border-top:2px solid var(--navy);border-bottom:0;font-family:var(--head);font-size:14px;font-weight:600;padding-top:12px}
.doc tr.prem td:first-child small{display:block;font-family:var(--body);font-size:10px;letter-spacing:.06em;color:var(--text-light);font-weight:500}
.gaps{width:100%;border-collapse:collapse;font-size:13px;margin-top:12px}
.gaps th{font-family:var(--head);font-weight:600;font-size:11px;letter-spacing:.1em;color:var(--gold-dark);text-align:right;padding:6px 8px;border-bottom:1px solid var(--line)}
.gaps th:first-child{text-align:left}
.gaps th{overflow-wrap:break-word}
.gaps td:first-child{white-space:nowrap}
.gaps td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums;font-weight:500}
.gaps td:first-child{text-align:left;font-family:var(--head);font-weight:600;letter-spacing:.04em;color:var(--navy)}
.gaps td:first-child i{display:inline-block;width:8px;height:16px;border-radius:2px;background:var(--c);vertical-align:-3px;margin-right:8px}
.gaps td.add{color:var(--gold-dark);font-weight:700}
.gaps td.short{color:var(--red);font-weight:700} .gaps td.ok{color:var(--ok);font-weight:700}
.notes{border:1px solid var(--line);border-radius:10px;min-height:70px;padding:10px 12px;font-size:13px;outline:none;white-space:pre-wrap;margin-top:12px}
.notes:empty::before{content:attr(data-ph);color:#A9A396}
.foot{padding:10px 28px;font-size:10px;color:var(--text-light);border-top:1px solid var(--line);display:flex;justify-content:space-between}
@media screen and (max-width:820px){
  .edit{margin:0 0 16px;border-radius:0}
  body:not(.capturing) .page{width:100%;min-height:0;margin:0 0 16px}
  body:not(.capturing) .client{grid-template-columns:1fr 1fr}
  body:not(.capturing) .client div:nth-child(2){border-right:0}
  body:not(.capturing) .client div:nth-child(-n+2){border-bottom:1px solid var(--line)}
  body:not(.capturing) .docwrap{overflow-x:auto}
  body:not(.capturing) .doc,body:not(.capturing) .gaps{min-width:540px}
  body:not(.capturing) .band{padding:16px;gap:12px}
  body:not(.capturing) .band img{height:40px}
  body:not(.capturing) .band h1{font-size:20px}
  body:not(.capturing) .body{padding:16px}
  body:not(.capturing) .foot{padding:10px 16px;gap:8px}
}
@page{size:A4;margin:0}
@media print{
  body{background:#fff}
  .tools,.edit,.status{display:none}
  .page{box-shadow:none;margin:0;width:210mm;height:297mm}
  .notes:empty::before{content:''}
}
</style>
</head>
<body>
<div class="tools">
  <a class="ghost" href="../index.html">PULSE</a>
  <a class="ghost" href="analysis.html">← ANALYSIS</a>
  <button class="primary" id="printBtn">DOWNLOAD PDF</button>
</div>
<div class="status" id="status"></div>

<section class="edit" id="edit">
  <h3>FILL IN THE PLANS</h3>
  <div class="upload">
    <label class="up">UPLOAD PROPOSAL PDF<input type="file" id="pdfIn" accept="application/pdf,.pdf" multiple></label>
    <span id="upMsg">Each PDF becomes one plan column. Check the numbers after – you can change anything.</span>
  </div>
  <div class="scroll"><table id="ed"></table></div>
  <div class="row-btns">
    <button type="button" id="addPlan">+ PLAN</button>
    <button type="button" id="addRow">+ COVERAGE</button>
  </div>
  <div class="opts">
    <label>Premium shown <select id="mode"><option value="month">per month</option><option value="year">per year</option></select></label>
    <label><input type="checkbox" id="showTotal" style="width:auto;min-width:0"> Show total column</label>
  </div>
</section>

<article class="page">
  <header class="band">
    <img src="ant-assets/logo-light.png" alt="ANT Wealth System">
    <h1>A-N-T <span>OFFER</span></h1>
    <div class="date">Prepared on<b id="date">—</b></div>
  </header>

  <div class="body">
    <div class="client">
      <div><small>Client</small><b id="cName">—</b></div>
      <div><small>Client ID</small><b id="cId">—</b></div>
      <div><small>Age</small><b id="cAge">—</b></div>
      <div><small>Agent</small><b id="cAgent">—</b><span class="ph" id="cAgentPh"></span></div>
    </div>

    <section>
      <h2>COVERAGE SUMMARY</h2>
      <div class="docwrap"><table class="doc" id="doc"></table></div>
    </section>

    <section id="gapSec">
      <h2>L.I.F.E – STILL SHORT AFTER EACH PLAN</h2>
      <div class="docwrap"><table class="gaps">
        <thead id="gapHead"></thead>
        <tbody id="gaps"></tbody>
      </table></div>
    </section>

    <section>
      <h2>NOTES</h2>
      <div class="notes" id="notes" contenteditable="true" data-ph="Tap to add notes before saving…"></div>
    </section>
  </div>
  <div class="foot"><span id="prep">ANT Wealth System · Analyze. Navigate. Transform.</span><span id="ref"></span></div>
</article>

<script src="ant-api.js"></script>
<script>
const AREAS = [
  {k:'hospitalization', name:'HOSPITALIZATION',  c:'#C0392B'},
  {k:'disability',      name:'DISABILITY',       c:'#D35400'},
  {k:'criticalIllness', name:'CRITICAL ILLNESS', c:'#E67E22'},
  {k:'death',           name:'DEATH',            c:'#C9962B'},
  {k:'education',       name:'EDUCATION',        c:'#2E86AB'},
  {k:'investment',      name:'INVESTMENT',       c:'#1B998B'}
];
const AREA = Object.fromEntries(AREAS.map(a => [a.k, a]));
// Usual coverages and the L.I.F.E area each one fills (can be changed per row).
const DEFAULT_ROWS = [
  ['LIFE', 'death'], ['ABCC', 'criticalIllness'], ['CANCER BOOSTER', 'criticalIllness'], ['SPECIAL BENEFIT', ''],
  ['MME', 'hospitalization'], ['ADD', 'disability'], ['MHSB', 'hospitalization'], ['PREMIUM CARE', '']
];
const $ = id => document.getElementById(id);
const esc = t => String(t ?? '').replace(/[&<>"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));
const fmt = n => n === null || n === undefined || n === '' ? '–' : Math.round(n).toLocaleString('en-US');
const num = v => { const t = String(v ?? '').replace(/RM|,|\s/gi, ''); if (!/^\d+(\.\d+)?$/.test(t)) return null; return parseFloat(t); };
// A cell shows a number nicely, or the text as typed (e.g. "MHSE 200").
const cell = v => num(v) !== null ? fmt(num(v)) : String(v ?? '').trim() ? esc(String(v).trim()) : '–';
const read = k => { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (_) { return null; } };
const write = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (_) {} };

const client = read('ant-factfind-current') || {name:'Sample Client', clientId:'C-0000', age:'—', agentName:'Agent Name', agentPhone:'012-000 0000'};
const analysis = read('ant-analysis-current');
const isSample = !read('ant-factfind-current');

// One offer per client kept on this phone, so a reopened page shows the last draft.
let offer = read('ant-offer-current');
if (!offer || offer.clientId !== client.clientId) {
  offer = {
    clientId: client.clientId, mode: 'month', showTotal: false, notes: '',
    plans: [{type:'pr', name:'Plan 1'}],
    rows: DEFAULT_ROWS.map(([label, area]) => ({label, area, v: ['']}))
  };
  if (isSample) {   // sample numbers so the layout can be checked
    offer.plans = [{type:'ex', name:'PN 992235'}, {type:'ex', name:'PN 1018883'}, {type:'pr', name:'Plan 1'}];
    const s = {LIFE:[5000,200000,100000], ABCC:[200000,'',''], 'CANCER BOOSTER':[100000,'',''], 'SPECIAL BENEFIT':[40000,'',''],
      MME:['',100000,''], ADD:['','',50000], MHSB:['','',150], 'PREMIUM CARE':['','',2400]};
    offer.rows.forEach(r => r.v = s[r.label]);
    offer.premium = [100, 100, 200];
  }
}
offer.premium = offer.premium || offer.plans.map(() => '');

// ---------- Editor ----------
function renderEditor() {
  const areaOpts = sel => `<option value="">— none —</option>` + AREAS.map(a => `<option value="${a.k}"${a.k === sel ? ' selected' : ''}>${a.name}</option>`).join('');
  const head = offer.plans.map((p, j) => `<th><div class="plan">
      <select data-p="${j}" data-f="type" aria-label="Plan ${j + 1} type"><option value="pr"${p.type === 'pr' ? ' selected' : ''}>Proposed</option><option value="ex"${p.type === 'ex' ? ' selected' : ''}>Existing</option></select>
      <input data-p="${j}" data-f="name" value="${esc(p.name)}" placeholder="Plan name / PN" aria-label="Plan ${j + 1} name">
      ${offer.plans.length > 1 ? `<button type="button" class="x" data-delp="${j}" aria-label="Remove plan ${j + 1}">×</button>` : ''}
    </div></th>`).join('');
  const body = offer.rows.map((r, i) => `<tr>
      <td><input data-r="${i}" data-f="label" value="${esc(r.label)}" aria-label="Coverage name"></td>
      <td><select data-r="${i}" data-f="area" aria-label="L.I.F.E area">${areaOpts(r.area)}</select></td>
      ${offer.plans.map((_, j) => `<td><input class="num" data-r="${i}" data-c="${j}" value="${esc(r.v[j] ?? '')}" aria-label="${esc(r.label)} amount"></td>`).join('')}
      <td><button type="button" class="x" data-delr="${i}" aria-label="Remove ${esc(r.label)}">×</button></td></tr>`).join('');
  const prem = offer.plans.map((_, j) => `<td><input class="num" inputmode="decimal" data-prem="${j}" value="${esc(offer.premium[j] ?? '')}" aria-label="Premium plan ${j + 1}"></td>`).join('');
  $('ed').innerHTML = `<thead><tr><th>COVERAGE</th><th>L.I.F.E AREA</th>${head}<th></th></tr></thead>
    <tbody>${body}</tbody><tfoot><tr><td class="lbl" colspan="2">PREMIUM (${offer.mode === 'year' ? 'PER YEAR' : 'PER MONTH'})</td>${prem}<td></td></tr></tfoot>`;
  $('mode').value = offer.mode; $('showTotal').checked = !!offer.showTotal;
}

$('ed').addEventListener('input', e => {
  const t = e.target, d = t.dataset;
  if (d.p !== undefined) offer.plans[d.p][d.f] = t.value;
  else if (d.c !== undefined) offer.rows[d.r].v[d.c] = t.value;
  else if (d.r !== undefined) offer.rows[d.r][d.f] = t.value;
  else if (d.prem !== undefined) offer.premium[d.prem] = t.value;
  renderDoc();
});
$('ed').addEventListener('click', e => {
  const d = e.target.dataset;
  if (d.delp !== undefined) { const j = +d.delp; offer.plans.splice(j, 1); offer.premium.splice(j, 1); offer.rows.forEach(r => r.v.splice(j, 1)); }
  else if (d.delr !== undefined) offer.rows.splice(+d.delr, 1);
  else return;
  renderEditor(); renderDoc();
});
$('addPlan').onclick = () => { offer.plans.push({type:'pr', name:'Plan ' + (offer.plans.length + 1)}); offer.premium.push(''); offer.rows.forEach(r => r.v.push('')); renderEditor(); renderDoc(); };
$('addRow').onclick = () => { offer.rows.push({label:'', area:'', v: offer.plans.map(() => '')}); renderEditor(); renderDoc(); $('ed').querySelector(`[data-r="${offer.rows.length - 1}"][data-f="label"]`).focus(); };
$('mode').onchange = e => { offer.mode = e.target.value; renderEditor(); renderDoc(); };
$('showTotal').onchange = e => { offer.showTotal = e.target.checked; renderDoc(); };
$('notes').addEventListener('input', () => { offer.notes = $('notes').innerText; write('ant-offer-current', offer); });

// ---------- Read a proposal PDF (on this phone, free – pdf.js) ----------
// Made for the Manulife proposal layout: "Plan Details" lines
// (name · policy term · face amount · modal premium), then "Total … Modal Premium".
const YEAR_FACTOR = {annual:1, yearly:1, 'semi-annual':2, 'half-yearly':2, quarterly:4, monthly:12};
// Where each plan line goes: an existing row, or a new row with the printed name.
const ALIAS = [
  [/PREMIUM CARE|WAIVER|PAYOR/i, 'PREMIUM CARE'],
  [/CANCER/i, 'CANCER BOOSTER'],
  [/\bABCC\b/i, 'ABCC'],
  [/\bMHSB\b/i, 'MHSB'],
  [/\bMME\b/i, 'MME'],
  [/\bADD\b/i, 'ADD'],
  [/SPECIAL BENEFIT/i, 'SPECIAL BENEFIT']
];
const guessArea = name =>
  /\bCI\b|CRITICAL|CANCER|ABCC/i.test(name) ? 'criticalIllness' :
  /ACCIDENT|\bADD\b|\bTPD\b|DISAB|INDEMNITY/i.test(name) ? 'disability' :
  /HEALTH|MEDICAL|HOSPITAL|\bMHS|\bMME\b|MEDI/i.test(name) ? 'hospitalization' :
  /EDUCAT/i.test(name) ? 'education' : /LIFE|DEATH/i.test(name) ? 'death' : '';

async function pdfLines(file) {
  if (!window.pdfjsLib) await loadScript('vendor/pdf.min.js');
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'vendor/pdf.worker.min.js';
  const doc = await pdfjsLib.getDocument({data: await file.arrayBuffer()}).promise;
  const lines = [];
  for (let n = 1; n <= Math.min(doc.numPages, 6); n++) {
    const items = (await (await doc.getPage(n)).getTextContent()).items.filter(it => it.str.trim());
    const rows = [];
    items.forEach(it => {
      const y = it.transform[5], x = it.transform[4];
      let row = rows.find(r => Math.abs(r.y - y) < 3);
      if (!row) rows.push(row = {y, parts: []});
      row.parts.push({x, s: it.str.trim()});
    });
    rows.sort((a, b) => b.y - a.y).forEach(r => lines.push(r.parts.sort((a, b) => a.x - b.x).map(p => p.s).join(' ').replace(/\s+/g, ' ')));
  }
  return lines;
}

function parseProposal(lines) {
  const out = {plan: '', mode: '', items: [], total: null};
  const pm = lines.join(' ').match(/Payment Mode\s*:?\s*(Semi-?Annual|Half-?Yearly|Annual|Yearly|Quarterly|Monthly)/i);
  if (pm) out.mode = pm[1].toLowerCase().replace('semiannual', 'semi-annual').replace('halfyearly', 'half-yearly');
  let start = lines.findIndex(l => /Policy Term/i.test(l) && /Face Amount|Sum Assured/i.test(l));
  if (start < 0) return out;
  // plan name · term · (ext rate) · face amount (number, or text like "MHSE 200") · (premium)
  const re = /^(.+?)\s+(\d{1,3})\s+(?:(\d+(?:\.\d+)?)\s+)??((?:[A-Z]{2,8}\s*)?\d[\d,]*(?:\.\d+)?)(?:\s+(\d[\d,]*\.\d{2}))?\s*\*?$/;
  for (let i = start + 1; i < lines.length; i++) {
    const l = lines[i];
    if (/^Total\b/i.test(l)) { const m = l.match(/(\d[\d,]*\.\d{2})\s*$/); if (m) out.total = num(m[1]); break; }
    const m = l.match(re);
    if (!m || !/[A-Za-z]/.test(m[1])) continue;
    const name = m[1].trim(), face = m[4].trim();
    out.items.push({name, face: /^[\d,.]+$/.test(face) ? face.replace(/\.00$/, '') : face, premium: m[5] ? num(m[5]) : null});
    if (!out.plan) out.plan = name;
  }
  return out;
}

function addProposal(p, fileName) {
  // Reuse an empty column (the blank "Plan 1") before adding a new one.
  let j = offer.plans.findIndex((_, k) => !String(offer.premium[k] ?? '').trim() && offer.rows.every(r => !String(r.v[k] ?? '').trim()));
  if (j < 0) { j = offer.plans.length; offer.plans.push({}); offer.premium.push(''); offer.rows.forEach(r => r.v.push('')); }
  const n = offer.plans.filter(x => x.type === 'pr' && x.name && x !== offer.plans[j]).length + 1;
  offer.plans[j] = {type: 'pr', name: (p.plan || fileName.replace(/\.pdf$/i, '')) + ' · Option ' + n};
  p.items.forEach((it, k) => {
    const label = k === 0 ? 'LIFE' : (ALIAS.find(([rx]) => rx.test(it.name)) || [])[1] || it.name.toUpperCase();
    let row = offer.rows.find(r => r.label.trim().toUpperCase() === label);
    if (!row) { row = {label, area: k === 0 ? 'death' : guessArea(it.name), v: offer.plans.map(() => '')}; offer.rows.push(row); }
    row.v[j] = it.face;
  });
  // Premium: the total, shown per month or per year as chosen.
  const yearly = p.total ?? p.items.reduce((a, b) => a + (b.premium || 0), 0);
  if (yearly) {
    const f = YEAR_FACTOR[p.mode] || 1, perYear = yearly * f;
    if (!offer.premium.some((v, k) => k !== j && String(v ?? '').trim())) offer.mode = f === 12 ? 'month' : 'year';
    offer.premium[j] = String(Math.round((offer.mode === 'month' ? perYear / 12 : perYear) * 100) / 100);
  }
}

function loadScript(src) {
  return new Promise((ok, fail) => { const t = document.createElement('script'); t.src = src; t.onload = ok; t.onerror = () => fail(new Error('Could not load ' + src)); document.head.appendChild(t); });
}

$('pdfIn').onchange = async e => {
  const files = [...e.target.files]; e.target.value = '';
  const msg = $('upMsg'); msg.className = ''; msg.textContent = 'Reading…';
  const done = [], failed = [];
  for (const f of files) {
    try {
      const lines = await pdfLines(f);
      if (!lines.length) { failed.push(f.name + ' (scanned picture – no text to read)'); continue; }
      const p = parseProposal(lines);
      if (!p.items.length) { failed.push(f.name + ' (layout not recognised)'); continue; }
      addProposal(p, f.name); done.push(f.name);
    } catch (err) { failed.push(f.name + ' (' + err.message + ')'); }
  }
  renderEditor(); renderDoc();
  msg.className = failed.length ? 'err' : 'ok';
  msg.textContent = (done.length ? '✓ Read ' + done.length + ' PDF' + (done.length > 1 ? 's' : '') + '. Please check the numbers. ' : '') +
    (failed.length ? 'Could not read: ' + failed.join(', ') + ' – please type these in.' : '');
};

// ---------- A4 document ----------
function renderDoc() {
  const plans = offer.plans, tot = offer.showTotal;
  const rows = offer.rows.filter(r => r.v.some(x => String(x ?? '').trim()));   // empty covers stay off the PDF
  const head = `<thead><tr><th>COVERAGE</th>${plans.map(p => `<th class="${p.type}"><span class="tag ${p.type}">${p.type === 'pr' ? 'PROPOSED' : 'EXISTING'}</span><b>${esc(p.name) || '—'}</b></th>`).join('')}${tot ? '<th class="tot"><b>TOTAL</b></th>' : ''}</tr></thead>`;
  const body = rows.map(r => {
    const raw = plans.map((_, j) => r.v[j]);
    const sum = raw.reduce((a, b) => a + (num(b) || 0), 0);
    const c = r.area && AREA[r.area] ? `--c:${AREA[r.area].c}` : '';
    return `<tr style="${c}"><td><i></i>${esc(r.label) || '—'}</td>${raw.map((v, j) => `<td class="${plans[j].type}${String(v ?? '').trim() ? '' : ' nil'}">${cell(v)}</td>`).join('')}${tot ? `<td class="tot">${sum ? fmt(sum) : '–'}</td>` : ''}</tr>`;
  }).join('');
  const prem = plans.map((_, j) => num(offer.premium[j]));
  const premSum = prem.reduce((a, b) => a + (b || 0), 0);
  const foot = `<tr class="prem"><td>PREMIUM<small>RM ${offer.mode === 'year' ? 'PER YEAR' : 'PER MONTH'}</small></td>${prem.map((v, j) => `<td class="${plans[j].type}${v === null ? ' nil' : ''}">${fmt(v)}</td>`).join('')}${tot ? `<td class="tot">${premSum ? fmt(premSum) : '–'}</td>` : ''}</tr>`;
  $('doc').innerHTML = head + `<tbody>${body}${foot}</tbody>`;

  // L.I.F.E: what the proposed plans add on top of today's cover (from the analysis)
  const life = analysis?.life;
  if (!life) { $('gapSec').style.display = 'none'; }
  else {
    $('gapSec').style.display = '';
    // Each proposed plan is a separate choice: show what is still short with that plan alone.
    const props = plans.map((p, j) => ({p, j})).filter(x => x.p.type === 'pr');
    const adds = props.map(({j}) => {
      const add = {};
      offer.rows.forEach(r => { if (r.area) add[r.area] = (add[r.area] || 0) + (num(r.v[j]) || 0); });
      return add;
    });
    $('gapHead').innerHTML = `<tr><th>AREA</th><th>FINANCIAL GOAL</th><th>CURRENT</th>${props.map(({p}) => `<th>${esc(p.name) || 'PLAN'}</th>`).join('')}</tr>`;
    $('gaps').innerHTML = AREAS.map(a => {
      const v = life[a.k] || {}, goal = v.goal ?? null, cur = v.current ?? null;
      if (goal === null) return '';
      return `<tr style="--c:${a.c}"><td><i></i>${a.name}</td><td>${fmt(goal)}</td><td>${fmt(cur)}</td>` +
        adds.map(add => { const left = goal - (cur || 0) - (add[a.k] || 0);
          return `<td class="${left > 0 ? 'short' : 'ok'}">${left > 0 ? fmt(left) : '✓'}</td>`; }).join('') + '</tr>';
    }).join('');
    if (!props.length || !$('gaps').innerHTML) $('gapSec').style.display = 'none';
  }
  write('ant-offer-current', offer);
}

// ---------- Header ----------
const now = new Date();
const dmy = d => String(d.getDate()).padStart(2, '0') + '/' + String(d.getMonth() + 1).padStart(2, '0') + '/' + d.getFullYear();
$('date').textContent = dmy(now);
$('cName').textContent = client.name || '—';
$('cId').textContent = client.clientId || '—';
$('cAge').textContent = client.age ?? '—';
$('cAgent').textContent = client.agentName || client.agentId || '—';
$('cAgentPh').textContent = client.agentPhone || '';
if (client.agentName) $('prep').textContent = 'Prepared by ' + client.agentName + (client.agentPhone ? ' · ' + client.agentPhone : '') + ' · ANT Wealth System';
$('ref').textContent = (client.clientId || '') + ' · ' + dmy(now);
document.title = `A-N-T Offer – ${client.name || 'Client'} – ${dmy(now).replace(/\//g, '-')}`;
$('notes').innerText = offer.notes || '';

renderEditor(); renderDoc();
$('printBtn').onclick = () => window.print();
</script>
