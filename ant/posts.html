<style>
:root{
  --navy:#0B2545; --gold:#F3AF3D; --gold-dark:#A86F14; --bg:#F4F2EC; --card:#fff;
  --text:#1B2433; --text-light:#5F6673; --border:#DAD6CC; --red:#C9402B; --ok:#2E8B3E;
  --head:'Oswald','Arial Narrow',sans-serif; --body:'Work Sans',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--body);background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:40px}
header{background:var(--navy);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:5}
header a{color:#fff;text-decoration:none;font-size:30px;line-height:1;padding:0 4px 4px 0}
header h1{font-family:var(--head);font-weight:600;font-size:20px;letter-spacing:.08em}
main{max-width:760px;margin:0 auto;padding:16px;display:grid;gap:14px}
.seg{display:flex;background:#fff;border:1px solid var(--border);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:none;border-radius:9px;min-height:44px;font:600 13px var(--head);letter-spacing:.08em;color:var(--navy);cursor:pointer}
.seg button[aria-pressed=true]{background:var(--navy);color:#fff}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px}
h2{font-family:var(--head);font-weight:600;font-size:15px;letter-spacing:.12em;color:var(--navy);margin-bottom:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--border);background:#fff;border-radius:999px;padding:9px 14px;min-height:40px;font:500 14px var(--body);cursor:pointer;color:var(--text)}
.chip[aria-pressed=true]{background:var(--navy);border-color:var(--navy);color:#fff}
.tpl{display:grid;gap:8px;margin-top:12px}
.tpl button{text-align:left;border:1px solid var(--border);background:#FBF6EA;border-radius:10px;padding:12px;min-height:44px;font:600 14px var(--body);cursor:pointer;color:var(--navy)}
.tpl button[aria-pressed=true]{border-color:var(--gold-dark);box-shadow:0 0 0 2px var(--gold)}
.tpl small{display:block;font-weight:400;color:var(--text-light);margin-top:2px}
label{display:block;font-size:13px;font-weight:600;color:var(--text-light);margin:10px 0 4px}
input,textarea{width:100%;border:1px solid var(--border);border-radius:10px;padding:10px 12px;font:15px var(--body);color:var(--text);background:#fff}
textarea{min-height:80px;resize:vertical}
input:focus,textarea:focus,button:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
.hint{font-size:12px;color:var(--text-light);margin-top:6px}
.out{display:grid;gap:12px}
.pcard{background:#fff;border:1px solid var(--border);border-radius:14px;overflow:hidden}
.pcard header{position:static;padding:10px 14px;gap:10px}
.pcard header b{font-family:var(--head);letter-spacing:.1em;font-size:14px}
.pcard header .count{margin-left:auto;font-size:12px;color:#C9D2E0}
.pcard header .count.over{color:#FFB4A6;font-weight:700}
.fb header{background:#1877F2}.ig header{background:linear-gradient(90deg,#833AB4,#E1306C,#F77737)}
.li header{background:#0A66C2}.xhs header{background:#FF2442}
.pcard .title{padding:10px 14px 0;font-weight:700}
.pcard pre{white-space:pre-wrap;word-wrap:break-word;font:14px/1.55 var(--body);padding:12px 14px;margin:0}
.pcard .acts{display:flex;gap:8px;padding:0 14px 12px;flex-wrap:wrap}
.btn{border:0;border-radius:10px;padding:10px 16px;min-height:44px;font:700 13px var(--head);letter-spacing:.08em;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center}
.btn.gold{background:var(--gold);color:var(--navy);box-shadow:0 3px 0 var(--gold-dark)}
.btn.ghost{background:#EEF1F5;color:var(--navy)}
.btn.small{min-height:40px;padding:8px 12px}
.done{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text-light);margin-left:auto}
.done input{width:auto}
.note{background:#FFF6E0;border:1px solid #F0D9A0;border-radius:10px;padding:10px 12px;font-size:13px}
.qitem{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--border)}
.qitem:last-child{border-bottom:0}
.qitem button.open{flex:1;text-align:left;background:none;border:0;font:600 14px var(--body);color:var(--navy);cursor:pointer;min-height:44px}
.qitem small{display:block;font-weight:400;color:var(--text-light)}
.dots{display:flex;gap:4px}
.dots span{width:24px;height:24px;border-radius:6px;font:700 10px var(--body);display:grid;place-items:center;background:#EEF1F5;color:#8A93A3}
.dots span.on{background:var(--ok);color:#fff}
.empty{color:var(--text-light);font-size:14px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 18px;border-radius:999px;font-weight:600;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20}
#toast.show{opacity:1}
</style>

/* ---------- state ---------- */
let pillar = 'aware', tplIdx = null, values = read('posts-values') || {};
let queue = read('posts-queue') || [];
let current = null;                       // {title, fb, ig, li, xt, xhs, img, note}

function fill(text) {
  return String(text || '').replace(/\{(\w+)\}/g, (_, k) => {
    let v = (values[k] || '').trim();
    if (!v && k.endsWith('_zh')) v = (values[k.slice(0, -3)] || '').trim();
    return v || '[' + (LABELS[k] || k) + ']';
  });
}

function renderPillars() {
  $('pillars').innerHTML = PILLARS.map(([k, n]) => `<button class="chip" data-p="${k}" aria-pressed="${k === pillar}">${n}</button>`).join('');
  const list = T.map((t, i) => ({t, i})).filter(x => x.t.p === pillar);
  $('tplList').innerHTML = list.map(({t, i}) => `<button data-t="${i}" aria-pressed="${i === tplIdx}">${esc(t.name)}<small>${esc(t.sub)}</small></button>`).join('');
}
$('pillars').onclick = e => { const b = e.target.closest('[data-p]'); if (!b) return; pillar = b.dataset.p; tplIdx = null; renderPillars(); $('fields').innerHTML = ''; $('out').innerHTML = ''; };
$('tplList').onclick = e => { const b = e.target.closest('[data-t]'); if (!b) return; tplIdx = +b.dataset.t; renderPillars(); renderFields(); renderFromTemplate(); };

function renderFields() {
  const t = T[tplIdx];
  const keys = [...new Set((t.fb + t.ig + t.li + t.xt + t.xhs + t.img).match(/\{(\w+)\}/g).map(s => s.slice(1, -1)))];
  const en = keys.filter(k => !k.endsWith('_zh')), zh = keys.filter(k => k.endsWith('_zh'));
  const box = k => {
    const long = /story|personal|situation|outcome|fact|why|hook|what|who|benefits|watch/.test(k);
    return `<label for="f_${k}">${esc(LABELS[k] || k)}</label>` + (long
      ? `<textarea id="f_${k}" data-k="${k}">${esc(values[k] || '')}</textarea>`
      : `<input id="f_${k}" data-k="${k}" value="${esc(values[k] || '')}">`);
  };
  $('fields').innerHTML = `<h2 style="margin-top:16px">2 · FILL IN</h2>` +
    (t.ex ? `<button class="btn ghost small" id="loadEx" type="button">LOAD PRS EXAMPLE</button><p class="hint">Ready-made PRS tax relief post – check the latest rules before posting.</p>` : '') +
    en.map(box).join('') +
    (zh.length ? `<h2 style="margin-top:16px">中文（小红书）</h2>` + zh.map(box).join('') : '');
}
$('fields').addEventListener('click', e => {
  if (e.target.id !== 'loadEx') return;
  Object.assign(values, EXAMPLES[T[tplIdx].ex]); write('posts-values', values); renderFields(); renderFromTemplate();
});
$('fields').addEventListener('input', e => {
  const k = e.target.dataset.k; if (!k) return;
  values[k] = e.target.value; write('posts-values', values); renderFromTemplate();
});

function renderFromTemplate() {
  if (tplIdx === null) return;
  const t = T[tplIdx];
  current = {title: t.name, fb: fill(t.fb), ig: fill(t.ig), li: fill(t.li), xt: fill(t.xt), xhs: fill(t.xhs), img: fill(t.img), note: ''};
  renderOut(current, null);
}

/* ---------- output cards ---------- */
function renderOut(post, qid) {
  const q = qid != null ? queue.find(x => x.id === qid) : null;
  const card = p => {
    const text = post[p.k] || '';
    if (!text.trim()) return '';
    const n = [...text].length, over = n > p.limit;
    const title = p.k === 'xhs' ? post.xt || '' : '';
    const tOver = title && [...title].length > p.titleLimit;
    return `<article class="pcard ${p.cls}">
      <header><b>${p.name}</b><span class="count ${over || tOver ? 'over' : ''}">${title ? 'Title ' + [...title].length + '/' + p.titleLimit + ' · ' : ''}${n}/${p.limit}</span></header>
      ${title ? `<div class="title">${esc(title)}</div>` : ''}
      <pre>${esc(text)}</pre>
      <div class="acts">
        ${title ? `<button class="btn ghost small" data-copy="xt">COPY TITLE</button>` : ''}
        <button class="btn gold small" data-copy="${p.k}">COPY</button>
        <a class="btn ghost small" href="${p.open}" target="_blank" rel="noopener">OPEN APP</a>
        ${q ? `<label class="done"><input type="checkbox" data-done="${p.k}"${q.done[p.k] ? ' checked' : ''}> Posted</label>` : ''}
      </div></article>`;
  };
  $('out').innerHTML =
    (post.note && post.note.trim() && post.note.trim() !== '-' ? `<div class="note"><b>Check:</b> ${esc(post.note)}</div>` : '') +
    PLATFORMS.map(card).join('') +
    (post.img ? `<div class="note"><b>Picture idea:</b> ${esc(post.img)}</div>` : '') +
    (q ? '' : `<button class="btn ghost" id="saveQ">SAVE TO MY POSTS</button>`);
  $('out').onclick = async e => {
    const c = e.target.closest('[data-copy]');
    if (c) {
      try { await navigator.clipboard.writeText(post[c.dataset.copy]); toast('Copied – paste it in the app'); }
      catch (_) { toast('Copy failed – press and hold the text to copy'); }
      return;
    }
    if (e.target.id === 'saveQ') { addToQueue(post); toast('Saved to My Posts'); }
  };
  $('out').onchange = e => {
    const k = e.target.dataset.done; if (!k || !q) return;
    q.done[k] = e.target.checked; write('posts-queue', queue);
  };
}

function addToQueue(post, date) {
  queue.unshift({id: Date.now() + Math.random(), date: date || '', title: post.title, fb: post.fb, ig: post.ig, li: post.li, xt: post.xt, xhs: post.xhs, img: post.img, note: post.note || '', done: {}});
  write('posts-queue', queue);
}

/* ---------- Claude batch ---------- */
const MAP = {FB: 'fb', IG: 'ig', LINKEDIN: 'li', 'XHS-TITLE': 'xt', XHS: 'xhs', IMAGE: 'img', NOTE: 'note'};
function parseBatch(text) {
  return String(text).split(/^\s*#{2,4}\s*POST\b/mi).slice(1).map(block => {
    const lines = block.split('\n');
    const head = lines.shift().replace(/^\s*\d*\s*\|?\s*/, '').split('|').map(s => s.trim()).filter(Boolean);
    const post = {title: head.slice(1).join(' · ') || head[0] || 'Post', date: head[0] || '', fb: '', ig: '', li: '', xt: '', xhs: '', img: '', note: ''};
    let key = null;
    lines.forEach(l => {
      const m = l.trim().match(/^\[(FB|IG|LINKEDIN|XHS-TITLE|XHS|IMAGE|NOTE)\]$/i);
      if (m) { key = MAP[m[1].toUpperCase()]; return; }
      if (key) post[key] += (post[key] ? '\n' : '') + l;
    });
    Object.keys(MAP).forEach(k => { post[MAP[k]] = post[MAP[k]].replace(/^\s*```\s*$/gm, '').trim(); });
    return post;
  }).filter(p => p.fb || p.ig || p.li || p.xhs);
}
$('readPaste').onclick = () => {
  const posts = parseBatch($('paste').value);
  if (!posts.length) { $('pasteMsg').textContent = 'No posts found. Paste the whole answer from Claude (it starts with "### POST 1").'; return; }
  posts.slice().reverse().forEach(p => addToQueue(p, p.date));
  $('paste').value = '';
  $('pasteMsg').textContent = '';
  toast(posts.length + ' post' + (posts.length > 1 ? 's' : '') + ' saved to My Posts');
  setMode('queue');
};
const MONTH_PROMPT = `Use my su-social-posts skill. Make this month's posts (1 per week, Wednesdays).
Month: [month & year]
Ideas (one per line, add any personal story you want in):
-
-
-
- `;
$('copyPrompt').onclick = async () => { try { await navigator.clipboard.writeText(MONTH_PROMPT); toast('Prompt copied – paste it in Claude'); } catch (_) { toast('Copy failed'); } };

/* ---------- My posts ---------- */
function renderQueue() {
  if (!queue.length) { $('queue').innerHTML = '<p class="empty">Nothing saved yet. Use a template or paste Claude\'s posts.</p>'; return; }
  $('queue').innerHTML = queue.map(q => `<div class="qitem">
      <button class="open" data-open="${q.id}">${esc(q.title)}<small>${esc(q.date || 'no date')}</small></button>
      <div class="dots" aria-label="Posted on">${PLATFORMS.map(p => `<span class="${q.done[p.k] ? 'on' : ''}" title="${p.name}">${p.k.toUpperCase()}</span>`).join('')}</div>
      <button class="btn ghost small" data-del="${q.id}" aria-label="Delete ${esc(q.title)}">×</button></div>`).join('');
}
$('queue').onclick = e => {
  const o = e.target.closest('[data-open]'), d = e.target.closest('[data-del]');
  if (o) { const q = queue.find(x => String(x.id) === o.dataset.open); if (q) { renderOut(q, q.id); $('out').scrollIntoView({behavior: 'smooth'}); } }
  if (d && confirm('Delete this post from My Posts?')) { queue = queue.filter(x => String(x.id) !== d.dataset.del); write('posts-queue', queue); renderQueue(); $('out').innerHTML = ''; }
};

/* ---------- modes ---------- */
function setMode(m) {
  [['tpl', 'mTpl', 'tplView'], ['claude', 'mClaude', 'claudeView'], ['queue', 'mQueue', 'queueView']].forEach(([k, b, v]) => {
    $(b).setAttribute('aria-pressed', k === m); $(v).hidden = k !== m;
  });
  $('out').innerHTML = '';
  if (m === 'queue') renderQueue();
  if (m === 'tpl') renderFromTemplate();
}
$('mTpl').onclick = () => setMode('tpl');
$('mClaude').onclick = () => setMode('claude');
$('mQueue').onclick = () => setMode('queue');

renderPillars();
})();
</script>
