name: Check code

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax check JS and Apps Script files
        run: |
          fail=0
          for f in js/*.js ant/ant-api.js; do
            node --check "$f" || fail=1
          done
          for f in *.gs; do
            cp "$f" "/tmp/$f.js"
            node --check "/tmp/$f.js" || fail=1
          done
          exit $fail
